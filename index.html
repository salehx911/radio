<!DOCTYPE html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- public view: no sign-in features -->
<title>إذاعة فصل أول ب</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1020;--panel:#111a30;--gold:#cfa95a;--gold2:#f0d9a0;--ivory:#f6f0e0;--mute:#9aa5ba;--line:rgba(207,169,90,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ivory);font-family:'Tajawal',Tahoma,sans-serif;background:var(--bg) radial-gradient(ellipse at 50% -10%,#1e2d57 0,rgba(10,16,32,0) 60%)}
main{max-width:640px;margin:0 auto;padding:36px 18px 56px}
.hero{text-align:center;margin-bottom:30px}
.mic{width:64px;height:64px;margin:0 auto 14px;display:block}
.school{font-family:'Reem Kufi',Tahoma,sans-serif;color:var(--gold);font-size:1.25rem;margin-bottom:8px}
.hero h1{font-family:'Reem Kufi',Tahoma,sans-serif;font-weight:700;font-size:2.6rem;margin:0;color:var(--gold2);letter-spacing:.5px}
.hero p{color:var(--mute);margin:10px 0 0;font-size:1.05rem}
.rule{height:1px;margin:22px auto 0;width:70%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.search{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--gold);border-radius:999px;padding:4px 20px}
.search input{flex:1;background:transparent;border:0;color:var(--ivory);font:inherit;font-size:1.15rem;padding:13px 0;outline:none}
.search input::placeholder{color:var(--mute)}
.search:focus-within{box-shadow:0 0 0 3px rgba(207,169,90,.35)}
#list{margin-top:22px;display:grid;gap:16px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px 22px 18px;outline:1px solid var(--line);outline-offset:-7px}
.card h2{font-family:'Reem Kufi',Tahoma,sans-serif;font-weight:500;font-size:1.5rem;margin:0;color:var(--ivory)}
.role{margin:4px 0 0;color:var(--gold);font-weight:700;font-size:1.05rem}
.topic{margin:12px 0 0;line-height:1.9;color:#dfe5f0}
.time{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);color:var(--mute);font-size:.95rem}
.empty{text-align:center;color:var(--mute);padding:34px 0}
#bar{position:fixed;inset-inline:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;background:rgba(10,16,32,.92);border-top:1px solid var(--line);backdrop-filter:blur(6px)}
#bar[hidden]{display:none}
button{font:inherit;font-weight:700;border-radius:999px;padding:10px 22px;border:1px solid var(--gold);background:transparent;color:var(--gold2);cursor:pointer}
button.pri{background:var(--gold);color:#1a1405}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.f{display:grid;gap:8px}
.f input,.f textarea{width:100%;background:#0a1020;border:1px solid var(--line);border-radius:6px;color:var(--ivory);font:inherit;padding:10px 12px}
.f label{font-size:.85rem;color:var(--mute)}
.del{position:absolute;inset-inline-start:12px;top:12px;padding:4px 12px;font-size:.85rem;color:#ff9b9b;border-color:#7a3a3a}
.note{text-align:center;color:var(--mute);font-size:.9rem;margin:0 0 14px}
body.pad main{padding-bottom:110px}
</style>
</head>
<body class="">
<main>
<header class="hero">
<svg class="mic" viewBox="0 0 64 64" fill="none" stroke="#cfa95a" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="32" cy="32" r="30" stroke-opacity=".5"></circle><rect x="25" y="13" width="14" height="24" rx="7"></rect><path d="M19 30c0 9 6 15 13 15s13-6 13-15M32 45v8M25 53h14"></path></svg>
<div class="school">إذاعة فصل أول ب</div><h1 id="title">وش دورك في الإذاعة؟</h1><p id="sub">اكتب اسمك وبيطلع لك دورك وفقرتك وموضوعك</p><div class="rule"></div>
</header>
<div id="head"></div>
<label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="اكتب اسمك هنا" autocomplete="off" aria-label="ابحث بالاسم"></label>
<div id="list" aria-live="polite"></div>
</main>
<div id="bar" hidden=""></div>
<script id="state" type="application/json">{"title":"وش دورك في الإذاعة؟","sub":"اكتب اسمك وبيطلع لك دورك وفقرتك وموضوعك","people":[{"name":"صالح بندر","role":"مقدم","topic":"افتتاح الإذاعة والترحيب بالحضور","time":"٧:٣٠ - ٧:٣٣"},{"name":"خالد علي","role":"قارئ القرآن","topic":"تلاوة آيات من سورة الفاتحة","time":"٧:٣٣ - ٧:٣٦"},{"name":"سعد عبدالله","role":"فقرة الحديث","topic":"حديث عن أهمية الصدق","time":"٧:٣٦ - ٧:٣٩"},{"name":"يوسف ناصر","role":"فقرة المعلومة","topic":"هل تعلم؟ معلومات عن الفضاء","time":"٧:٣٩ - ٧:٤٢"}]}</script>
<script>
const S=JSON.parse(document.getElementById('state').textContent);
const $=id=>document.getElementById(id);
let canEdit=false,editing=false,dirty=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s).replace(/[\u064B-\u065F\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim().toLowerCase();
function render(){
  $('title').textContent=S.title;$('sub').textContent=S.sub;
  const list=$('list'),head=$('head');
  document.body.classList.toggle('pad',canEdit);
  if(editing){
    head.innerHTML=`<div class="card f" style="margin-bottom:16px"><label>العنوان</label><input id="et" value="${esc(S.title)}"><label>الوصف</label><input id="es" value="${esc(S.sub)}"></div>`;
    $('et').oninput=e=>{S.title=e.target.value;dirty=true;$('title').textContent=S.title};
    $('es').oninput=e=>{S.sub=e.target.value;dirty=true;$('sub').textContent=S.sub};
    list.innerHTML=S.people.map((p,i)=>`<div class="card f" data-i="${i}"><button class="del" data-del="${i}">حذف</button><label>الاسم</label><input data-k="name" value="${esc(p.name)}"><label>الدور</label><input data-k="role" value="${esc(p.role)}"><label>موضوع الفقرة</label><textarea data-k="topic" rows="2">${esc(p.topic)}</textarea><label>الوقت</label><input data-k="time" value="${esc(p.time)}"></div>`).join('');
    list.querySelectorAll('[data-k]').forEach(el=>el.oninput=e=>{S.people[+el.closest('[data-i]').dataset.i][el.dataset.k]=el.value;dirty=true});
    list.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{S.people.splice(+b.dataset.del,1);dirty=true;render()});
  }else{
    head.innerHTML='';
    const t=norm($('q').value);
    const res=t?S.people.filter(p=>norm(p.name).includes(t)):S.people;
    list.innerHTML=res.length?res.map(p=>`<article class="card"><h2>${esc(p.name)}</h2><p class="role">${esc(p.role)}</p><p class="topic">${esc(p.topic)}</p>${p.time?`<div class="time">الوقت: ${esc(p.time)}</div>`:''}</article>`).join(''):'<p class="empty">ما لقينا هذا الاسم. تأكد من الكتابة أو كلم قائد الإذاعة.</p>';
  }
  bar();
}
function bar(){
  const b=$('bar');b.hidden=!canEdit;if(!canEdit)return;
  b.innerHTML=editing?'<button id="add">+ إضافة شخص</button><button id="save" class="pri">حفظ ونشر</button><button id="cancel">إلغاء</button>':'<button id="edit" class="pri">تعديل الأسماء والأدوار</button>';
  if(editing){
    $('add').onclick=()=>{S.people.push({name:'',role:'',topic:'',time:''});dirty=true;render();scrollTo(0,document.body.scrollHeight)};
    $('save').onclick=save;
    $('cancel').onclick=()=>location.reload();
  }else $('edit').onclick=()=>{editing=true;render()};
}
async function save(){
  const btn=$('save');btn.disabled=true;btn.textContent='جاري النشر...';
  try{
    const art=await claude.use('artifact');
    const d=document.cloneNode(true);
    d.getElementById('state').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
    d.getElementById('list').innerHTML='';d.getElementById('head').innerHTML='';
    d.getElementById('bar').hidden=true;d.getElementById('bar').innerHTML='';
    d.body.className='';
    await art.publish('<!DOCTYPE html>\n'+d.documentElement.outerHTML);
  }catch(e){btn.disabled=false;btn.textContent='حفظ ونشر';alert('ما انحفظ التعديل، حاول مرة ثانية.')}
}
$('q').addEventListener('input',render);
render();
(async()=>{try{const u=await window.claude?.use('user');if(u&&u.canEdit()){canEdit=true;render()}}catch(e){}})();
</script>


</body></html>
